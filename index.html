<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Smart Schedule</title>
<meta name="theme-color" content="#1b2028" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
:root, [data-theme="dark"] {
  --bg: #1b2028; --surf: #222834; --card: #222834; --card2: #2a3140; --ink: #e8edf4;
  --muted: #8b95a5; --line: #323a48; --accent: #4a7cb8; --accent-dim: #2a3d55;
  --warn: #d4a56a; --danger: #e07a72; --fixed: #7a93b0; --sleep: #252b36;
  --safe: env(safe-area-inset-bottom, 0px); --top: env(safe-area-inset-top, 0px);
  --hour: 38px; --radius: 14px;
}
[data-theme="light"] {
  --bg: #eef1f5; --surf: #f7f9fc; --card: #ffffff; --card2: #e8edf3; --ink: #1b2028;
  --muted: #5c6675; --line: #d5dbe4; --accent: #3d6ea8; --accent-dim: #dce6f2;
  --warn: #8a5a22; --danger: #8f3a36; --fixed: #3d5f86; --sleep: #e6e9f0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 15px; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { height: 100%; display: flex; flex-direction: column; padding-bottom: calc(84px + var(--safe)); overflow: hidden; }
.topbar {
  z-index: 8; padding: calc(12px + var(--top)) 16px 10px;
  background: var(--bg); display: flex; align-items: center; gap: 10px;
}
.brand { font-weight: 600; font-size: 17px; letter-spacing: -.02em; }
.brand em { font-style: normal; color: var(--muted); font-weight: 500; }
.grow { flex: 1; }
.iconbtn, .btn {
  background: var(--surf); border: 1px solid var(--line); color: var(--ink);
  border-radius: 11px; padding: 8px 12px; cursor: pointer; min-height: 40px;
}
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.btn.danger { background: transparent; border-color: transparent; color: var(--danger); }
.btn.wide { width: 100%; justify-content: center; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.navdate { text-align: center; font-size: 13px; color: var(--muted); font-weight: 500; }
.sheet { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(28,27,24,.35); }
.sheet.show { display: block; }
.sheet .panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow: auto;
  background: var(--surf); border-radius: 20px 20px 0 0; padding: 10px 18px calc(22px + var(--safe));
}
.sheet .panel::before { content:""; display:block; width:36px; height:4px; border-radius:4px; background: var(--line); margin: 4px auto 14px; }
h2 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -.03em; }
label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 12px; font-weight: 500; }
input, select, textarea { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 14px; }
.list { display: grid; gap: 10px; }
.card { background: var(--surf); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card .t { font-weight: 600; } .card .s { color: var(--muted); font-size: 13px; margin-top: 4px; }
.tabbar {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe)); z-index: 9;
  display: grid; grid-template-columns: 1fr 1fr 56px 1fr 1fr;
  background: color-mix(in srgb, var(--card) 92%, transparent); border: 1px solid var(--line);
  border-radius: 24px; padding: 6px 4px; backdrop-filter: blur(16px);
}
.tabbar button { background: none; border: 0; color: var(--muted); padding: 10px 2px; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.tabbar button.on { color: var(--ink); }
.tabbar .plus {
  width: 44px; height: 44px; border-radius: 14px; background: var(--card2); color: var(--ink); font-size: 24px;
  margin: 0 auto; border: 0; padding: 0; line-height: 44px; font-weight: 500;
}
main { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.view { padding: 4px 16px 16px; flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
#calView { display: flex; flex-direction: column; overflow: hidden; }
.view[hidden], [hidden] { display: none !important; }
.page { flex: 1; min-height: 0; overflow: auto; }
#calBody { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
.syncdot { width: 7px; height: 7px; border-radius: 50%; background: #c5c0b6; display: inline-block; }
.syncdot.on { background: var(--accent); }
.icon-top { width: 40px; min-height: 40px; padding: 0; display: grid; place-items: center; font-size: 18px; border: 0; background: transparent; color: var(--muted); }
.icon-top svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.top-nav {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  padding: 6px; border: 1px solid var(--line); border-radius: 16px; background: var(--surf);
}
.pagehead { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
.pagehead h2 { margin: 0; }
.back { width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--card2); color: var(--ink); }
.home-kicker { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.home-kicker:after { content:""; display:block; width:28px; height:2px; background:#d4b06a; margin:8px 0 10px; }
.home-title { font-size: 34px; font-weight: 650; letter-spacing: -.03em; margin: 0 0 6px; line-height: 1.05; }
.home-date { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.pockets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 18px; }
.pocket { border: 0; border-radius: 18px; padding: 16px 14px 14px; min-height: 128px; display: flex; flex-direction: column; justify-content: space-between; color: #eef2f8; }
.pocket.now { background: linear-gradient(160deg,#3a5270,#1c2a3c); }
.pocket.next { background: linear-gradient(160deg,#c4a45a,#6e5a2c); color: #1a140c; }
.pocket .pi { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,.28); display: grid; place-items: center; font-size: 14px; }
.pocket .pl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .72; margin-top: 16px; }
.pocket .pt { font-size: 24px; font-weight: 550; margin-top: 2px; letter-spacing: -.02em; }
.pocket .pm { font-size: 12px; opacity: .7; margin-top: 4px; }
.agenda { display: grid; gap: 0; }
.ag-row { display: grid; grid-template-columns: 18px 72px 1fr; gap: 10px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.ag-row .rail { width: 10px; height: 10px; border: 1.5px solid #d4b06a; border-radius: 50%; margin-top: 5px; }
.ag-row .when { color: #d4b06a; font-size: 12px; font-weight: 600; padding-top: 3px; }
.ag-row .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.empty { text-align: center; padding: 36px 12px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
.hours { position: relative; min-height: calc(24 * var(--hour)); }
.hourrow { height: var(--hour); border-top: 1px solid var(--line); display: flex; }
.hourlab { width: 44px; flex: none; font-size: 10px; color: var(--muted); padding-top: 2px; }
.hourslot { flex: 1; position: relative; }
.day-blocks { position: absolute; left: 44px; right: 0; top: 0; height: calc(24 * var(--hour)); z-index: 3; pointer-events: none; }
.day-blocks .block { pointer-events: auto; cursor: pointer; }
.block {
  position: absolute; left: 4px; right: 6px; border-radius: 8px; padding: 3px 7px 3px 8px;
  overflow: hidden; font-size: 11px; line-height: 1.15; color: var(--ink); z-index: 2;
  background: var(--surf); border: 1px solid var(--line); border-left-width: 3px;
}
.block .tm { font-size: 10px; color: var(--muted); }
.block.sleep { background: var(--sleep); color: var(--muted); border-left-color: #8b86a3; z-index: 1; }
.nowline { position: absolute; left: 40px; right: 0; height: 0; border-top: 1.5px solid var(--danger); z-index: 4; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.login-screen {
  position: fixed; inset: 0; z-index: 30; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
}
.login-screen h1 { font-size: 28px; margin: 0 0 8px; }
.login-screen p { color: var(--muted); margin: 0 0 24px; }
.login-box { width: 100%; max-width: 340px; text-align: left; }
.login-box label { margin-bottom: 14px; }
.login-msg { color: var(--danger); font-size: 13px; min-height: 20px; margin: 8px 0; }
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-chip{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card2);text-align:left;color:var(--ink);width:100%}
.theme-chip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme-swatch{height:28px;border-radius:8px;margin-bottom:8px;display:flex;overflow:hidden}
.theme-swatch i{flex:1}
</style>
</head>
<body>
<div id="loginScreen" class="login-screen" hidden>
  <h1>Smart Schedule</h1>
  <p>Sign in to sync your schedule across devices</p>
  <div class="login-box">
    <label>Email<input type="email" id="loginEmail" placeholder="you@email.com" autocomplete="email" /></label>
    <label>Password<input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" /></label>
    <div class="login-msg" id="loginMsg"></div>
    <div class="actions" style="flex-direction:column;gap:10px">
      <button class="btn primary wide" id="loginSignIn">Sign in</button>
      <button class="btn wide" id="loginSignUp">Create account</button>
      <button class="btn ghost wide" id="loginSkip">Continue without account</button>
    </div>
  </div>
</div>

<div class="app" id="mainApp">
  <header class="topbar">
    <div class="brand">Smart <em>Schedule</em></div>
    <span class="syncdot" id="syncDot"></span>
    <div class="grow"></div>
    <button class="btn ghost icon-top" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main>
    <div class="view" id="calView">
      <div class="top-nav">
        <button class="iconbtn" id="prev">‹</button>
        <div class="grow navdate" id="navDate"></div>
        <button class="iconbtn" id="todayBtn">Today</button>
        <button class="iconbtn" id="next">›</button>
      </div>
      <div id="calBody"></div>
    </div>
    <div class="view page" id="settingsView" hidden>
      <div class="pagehead"><button class="back" data-back>‹</button><h2>Settings</h2></div>
      <div class="card">
        <div class="t">Account</div>
        <p class="hint" id="accountStatus">Checking…</p>
        <div id="accountActions" class="actions" style="justify-content:flex-start;flex-wrap:wrap"></div>
      </div>
      <div class="card" style="margin-top:8px">
        <div class="t">Sleep window</div>
        <div class="row">
          <label>Sleep starts<input type="time" id="sleepStart" /></label>
          <label>Wake<input type="time" id="sleepEnd" /></label>
        </div>
      </div>
      <div class="card" style="margin-top:8px">
        <div class="t">Default travel (minutes)</div>
        <label><input type="number" id="defTravel" min="0" max="180" /></label>
      </div>
      <div class="card" style="margin-top:8px">
        <div class="t">Look</div>
        <div class="theme-grid" id="styleGrid"></div>
      </div>
      <div class="actions" style="margin-top:12px">
        <button class="btn primary wide" id="saveLocal">Save settings</button>
      </div>
    </div>
  </main>
</div>
<nav class="tabbar">
  <button data-tab="cal" data-range="today" class="on">Today</button>
  <button data-tab="cal" data-range="day">Day</button>
  <button class="plus" id="tabAdd" type="button">+</button>
  <button data-tab="cal" data-range="week">Week</button>
  <button data-tab="cal" data-range="month">Month</button>
</nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script type="module">
// ========== HARDCODED FIREBASE CONFIG ==========
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAgtfxwwqRbXMzmaZg7rjjGz0msO_mXnwI",
  authDomain: "smart-schedule-25056.firebaseapp.com",
  projectId: "smart-schedule-25056",
  storageBucket: "smart-schedule-25056.firebasestorage.app",
  messagingSenderId: "754030397012",
  appId: "1:754030397012:web:a2d2094d1807a966fb0fc1"
};

const KEY = "smart-schedule-engine-v2";
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now();
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const dowMon = dateStr => (parseYmd(dateStr).getDay()+6)%7;
const minToTime = m => { m=((m%1440)+1440)%1440; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; };
const timeToMin = t => { if(!t) return 0; const [h,mi]=String(t).split(":").map(Number); return h*60+(mi||0); };
const fmtRange = (a,b) => `${minToTime(a)}–${minToTime(b)}`;
const todayStr = () => ymd(new Date());
const hex = c => {
  if (!c) return "#3dba9b";
  if (/^#[0-9a-fA-F]{6}$/.test(c)) return c.toLowerCase();
  if (/^#[0-9a-fA-F]{3}$/.test(c)) return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  return "#3dba9b";
};

function defaultState() {
  return {
    settings: { sleepStart: 23*60, sleepEnd: 7*60, defaultTravel: 15, style: "slate" },
    templates: [], fixed: [], placed: [], conflicts: [], plannedWeeks: [],
    friends: [], clip: null
  };
}
let state = load();
let view = "cal", range = "today", cursor = new Date();
let fb = { app:null, db:null, auth:null, user:null };
let skipLogin = localStorage.getItem("ss-skip-login") === "1";

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY)||"{}");
    const base = defaultState();
    return { ...base, ...raw, settings: { ...base.settings, ...(raw.settings||{}) } };
  } catch { return defaultState(); }
}
function saveLocal() {
  localStorage.setItem(KEY, JSON.stringify(state));
  queueCloud();
}

// ========== FIREBASE ==========
async function initFirebase() {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js");
    const { getAuth, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js");
    const { getFirestore } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js");

    fb.app = initializeApp(FIREBASE_CONFIG);
    fb.auth = getAuth(fb.app);
    fb.db = getFirestore(fb.app);

    return new Promise((resolve) => {
      onAuthStateChanged(fb.auth, async (user) => {
        fb.user = user;
        if (user) {
          skipLogin = false;
          localStorage.removeItem("ss-skip-login");
          await loadCloudState(user.uid);
          showMainApp();
        } else if (skipLogin) {
          showMainApp();
        } else {
          showLoginScreen();
        }
        updateAccountUI();
        resolve(user);
      });
    });
  } catch (err) {
    console.error("Firebase init failed:", err);
    // Still let the user use the app offline
    skipLogin = true;
    showMainApp();
  }
}

async function loadCloudState(uid) {
  try {
    const { doc, getDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js");
    const ref = doc(fb.db, "users", uid);
    const snap = await getDoc(ref);
    if (snap.exists() && snap.data().state) {
      const cloud = snap.data().state;
      state = { ...defaultState(), ...cloud };
      localStorage.setItem(KEY, JSON.stringify(state));
    }
    onSnapshot(ref, (s) => {
      if (s.exists() && s.data().state) {
        state = { ...defaultState(), ...s.data().state };
        localStorage.setItem(KEY, JSON.stringify(state));
        render();
      }
    });
  } catch (err) {
    console.warn("Cloud load error", err);
  }
}

let cloudTimer;
function queueCloud() {
  if (!fb.db || !fb.user) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async () => {
    try {
      const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js");
      await setDoc(doc(fb.db, "users", fb.user.uid), { state, updatedAt: Date.now() });
      $("syncDot").classList.add("on");
    } catch {
      $("syncDot").classList.remove("on");
    }
  }, 600);
}

async function doSignIn() {
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;
  if (!email || !password) { $("loginMsg").textContent = "Enter email and password."; return; }
  try {
    $("loginMsg").textContent = "Signing in…";
    const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js");
    await signInWithEmailAndPassword(fb.auth, email, password);
  } catch (err) {
    $("loginMsg").textContent = err.message || "Sign in failed.";
  }
}

async function doSignUp() {
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;
  if (!email || !password) { $("loginMsg").textContent = "Enter email and password."; return; }
  if (password.length < 6) { $("loginMsg").textContent = "Password must be at least 6 characters."; return; }
  try {
    $("loginMsg").textContent = "Creating account…";
    const { createUserWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js");
    await createUserWithEmailAndPassword(fb.auth, email, password);
  } catch (err) {
    $("loginMsg").textContent = err.message || "Sign up failed.";
  }
}

async function doSignOut() {
  try {
    const { signOut } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js");
    await signOut(fb.auth);
    skipLogin = false;
    localStorage.removeItem("ss-skip-login");
  } catch (err) {
    alert(err.message || "Sign out failed");
  }
}

function showLoginScreen() {
  $("loginScreen").hidden = false;
  $("mainApp").style.display = "none";
  document.querySelector(".tabbar").style.display = "none";
}

function showMainApp() {
  $("loginScreen").hidden = true;
  $("mainApp").style.display = "";
  document.querySelector(".tabbar").style.display = "";
  render();
}

function updateAccountUI() {
  const status = $("accountStatus");
  const actions = $("accountActions");
  if (!status || !actions) return;
  if (fb.user) {
    status.textContent = `Signed in as ${fb.user.email}`;
    $("syncDot").classList.add("on");
    actions.innerHTML = `<button class="btn danger" id="btnSignOut">Sign out</button>`;
    $("btnSignOut").onclick = doSignOut;
  } else {
    status.textContent = "Not signed in · data is local only";
    $("syncDot").classList.remove("on");
    actions.innerHTML = `<button class="btn primary" id="btnGoLogin">Sign in / Create account</button>`;
    $("btnGoLogin").onclick = () => {
      skipLogin = false;
      localStorage.removeItem("ss-skip-login");
      showLoginScreen();
    };
  }
}

// ========== APP UI ==========
const $ = id => document.getElementById(id);

function showTab(tab) {
  view = tab;
  ["cal","settings"].forEach(t => { const el=$(t+"View"); if (el) el.hidden = t !== tab; });
  document.querySelectorAll(".tabbar button[data-tab]").forEach(b => {
    b.classList.toggle("on", b.dataset.tab===tab && (!b.dataset.range || b.dataset.range===range));
  });
  render();
}

function openSheet(html) {
  $("panel").innerHTML = html;
  $("sheet").classList.add("show");
}
function closeSheet() { $("sheet").classList.remove("show"); }
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

function render() {
  saveLocal();
  $("navDate").textContent = navLabel();
  if (view === "cal") renderCal();
  if (view === "settings") renderSettings();
  updateAccountUI();
}

function navLabel() {
  if (range === "day" || range === "today") return cursor.toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});
  if (range === "week") {
    const m = monday(cursor), s = addDays(m,6);
    return `${m.toLocaleDateString(undefined,{month:"short",day:"numeric"})} – ${s.toLocaleDateString(undefined,{month:"short",day:"numeric"})}`;
  }
  return cursor.toLocaleDateString(undefined,{month:"long", year:"numeric"});
}

function sleepBlocks(dateStr) {
  const a = state.settings.sleepStart, b = state.settings.sleepEnd;
  if (a === b) return [];
  if (a < b) return [{ date: dateStr, start: a, end: b, kind: "sleep" }];
  return [{ date: dateStr, start: a, end: 1440, kind: "sleep" }, { date: dateStr, start: 0, end: b, kind: "sleep" }];
}

function eventsOn(dateStr) {
  const list = [];
  sleepBlocks(dateStr).forEach(s => list.push({ ...s, title:"Sleep", color:"#2a3148", kind:"sleep" }));
  state.fixed.filter(e => e.date===dateStr).forEach(e => list.push({ ...e, kind:"fixed" }));
  state.placed.filter(e => e.date===dateStr).forEach(e => list.push(e));
  return list.sort((a,b)=>a.start-b.start);
}

function catColor(ev) {
  if (ev.kind==="sleep") return "#8b86a3";
  if (ev.color) return ev.color;
  const n = (ev.title||"").toLowerCase();
  if (n.includes("work")) return "#3d5f86";
  if (n.includes("gym")) return "#3d6b58";
  return "#3d5c54";
}

function eventIcon(ev) {
  const n = ((ev.title||"")+" "+(ev.kind||"")).toLowerCase();
  if (ev.kind==="sleep" || /sleep|bed/.test(n)) return "☾";
  if (/gym|workout|lift|train/.test(n)) return "♟";
  if (/work|shift|job|office/.test(n)) return "▣";
  return "●";
}

function nowMin() { const d=new Date(); return d.getHours()*60+d.getMinutes(); }

function inSleep(m) {
  const a=state.settings.sleepStart, b=state.settings.sleepEnd;
  return a>b ? (m>=a || m<b) : (m>=a && m<b);
}

function renderCal() {
  if (range === "today") $("calBody").innerHTML = todayHome(ymd(cursor));
  else if (range === "day") $("calBody").innerHTML = dayGrid(ymd(cursor));
  else if (range === "week") $("calBody").innerHTML = weekGrid();
  else $("calBody").innerHTML = monthGrid();
}

function todayHome(ds) {
  const evs = eventsOn(ds).filter(e=>e.kind!=="sleep").sort((a,b)=>a.start-b.start);
  const now = ds===todayStr() ? nowMin() : -1;
  const sleeping = now>=0 && inSleep(now);
  const cur = evs.find(e => now>=e.start && now<e.end);
  const next = evs.find(e => e.start >= (now<0?0:now));
  const agenda = evs.map(e => `<div class="ag-row" data-kind="${e.kind}" data-id="${e.id||""}">
    <span class="rail"></span><span class="when">${minToTime(e.start)}</span>
    <span><b>${e.title}</b><div class="sub">${fmtRange(e.start,e.end)}</div></span>
  </div>`).join("") || `<div class="empty"><b>Nothing on the agenda</b>Tap + to add an event.</div>`;
  const nowTitle = cur ? cur.title : (sleeping ? "Sleep" : "Free");
  const nowWhen = cur ? fmtRange(cur.start,cur.end) : (sleeping ? fmtRange(state.settings.sleepStart, state.settings.sleepEnd) : (now>=0?minToTime(now):"—"));
  const nextTitle = next ? next.title : "—";
  const nextWhen = next ? fmtRange(next.start,next.end) : "Nothing later";
  const dateLine = cursor.toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
  return `<div class="home-kicker">Smart Schedule</div>
    <div class="home-title">${ds===todayStr()?"Today":cursor.toLocaleDateString(undefined,{weekday:"long"})}</div>
    <div class="home-date">${dateLine}</div>
    <div class="pockets">
      <div class="pocket now"><div class="pi">${cur?eventIcon(cur):"☾"}</div><div><div class="pl">Now</div><div class="pt">${nowTitle}</div><div class="pm">${nowWhen}</div></div></div>
      <div class="pocket next"><div class="pi">${next?eventIcon(next):"→"}</div><div><div class="pl">Next</div><div class="pt">${nextTitle}</div><div class="pm">${nextWhen}</div></div></div>
    </div>
    <div class="agenda">${agenda}</div>`;
}

function dayGrid(dateStr) {
  let hours = "";
  for (let h=0;h<24;h++) hours += `<div class="hourrow"><div class="hourlab">${h===0?"12a":h<12?h+"a":h===12?"12p":(h-12)+"p"}</div><div class="hourslot" data-date="${dateStr}" data-hour="${h}"></div></div>`;
  const blocks = eventsOn(dateStr).map(ev => {
    const top = (ev.start / 1440) * 100;
    const h = Math.max(1.6, ((ev.end-ev.start)/1440)*100);
    const col = catColor(ev);
    return `<div class="block ${ev.kind}" data-kind="${ev.kind}" data-id="${ev.id||""}" data-date="${dateStr}" style="top:${top}%;height:calc(${h}% - 2px);border-left-color:${col}">${eventIcon(ev)} ${ev.title}<div class="tm">${fmtRange(ev.start,ev.end)}</div></div>`;
  }).join("");
  const now = dateStr===todayStr() ? `<div class="nowline" style="top:${(nowMin()/1440)*100}%"></div>` : "";
  return `<div class="hours">${hours}<div class="day-blocks">${now}${blocks}</div></div>`;
}

function weekGrid() {
  const m = monday(cursor);
  const days = Array.from({length:7},(_,i)=>addDays(m,i));
  const today = todayStr();
  let html = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px">`;
  days.forEach(d => {
    html += `<div style="${ymd(d)===today?'color:var(--accent);font-weight:600':''}">${DOW[dowMon(ymd(d))]}<br>${d.getDate()}</div>`;
  });
  html += `</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">`;
  days.forEach(d => {
    const ds = ymd(d);
    const evs = eventsOn(ds).filter(e=>e.kind!=="sleep").slice(0,4);
    html += `<div style="background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:80px;font-size:11px">`;
    evs.forEach(e => { html += `<div style="margin-bottom:3px;border-left:3px solid ${catColor(e)};padding-left:4px">${e.title}</div>`; });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function monthGrid() {
  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const start = monday(first);
  let html = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">`;
  DOW.forEach(d => html += `<div style="text-align:center;font-size:11px;color:var(--muted);padding:4px">${d}</div>`);
  for (let i=0;i<42;i++) {
    const d = addDays(start,i); const ds = ymd(d);
    const out = d.getMonth() !== cursor.getMonth();
    const pills = eventsOn(ds).filter(e=>e.kind!=="sleep").slice(0,3).map(e =>
      `<div style="font-size:10px;border-left:3px solid ${catColor(e)};padding-left:3px;margin-top:2px;white-space:nowrap;overflow:hidden">${e.title}</div>`).join("");
    html += `<div data-date="${ds}" style="min-height:64px;background:var(--surf);border:1px solid ${ds===todayStr()?'var(--accent)':'var(--line)'};border-radius:10px;padding:4px;font-size:12px;opacity:${out?0.4:1}"><b>${d.getDate()}</b>${pills}</div>`;
  }
  html += `</div>`;
  return html;
}

const STYLES = [
  { id:"slate", name:"Slate", a:"#1b2028", b:"#4a7cb8", c:"#2a3140" },
  { id:"vault", name:"Vault", a:"#0c121b", b:"#d4b06a", c:"#171e2a" },
  { id:"ice", name:"Ice", a:"#071018", b:"#b8d4e8", c:"#10202c" },
  { id:"midnight", name:"Midnight", a:"#050505", b:"#e0c078", c:"#12100c" },
  { id:"harbour", name:"Harbour", a:"#04141c", b:"#4fd4c0", c:"#0c2430" },
  { id:"graphite", name:"Graphite", a:"#0e0e10", b:"#c2c2c4", c:"#1a1b1e" },
  { id:"ember", name:"Ember", a:"#140c08", b:"#e89448", c:"#221610" },
  { id:"alpine", name:"Alpine", a:"#0a1614", b:"#e0d0a0", c:"#142824" },
  { id:"signal", name:"Signal", a:"#0a1018", b:"#ffcc33", c:"#141c28" }
];

function applyStyle() {
  document.documentElement.setAttribute("data-style", state.settings.style || "slate");
}

function renderSettings() {
  $("sleepStart").value = minToTime(state.settings.sleepStart);
  $("sleepEnd").value = minToTime(state.settings.sleepEnd);
  $("defTravel").value = state.settings.defaultTravel;
  const cur = state.settings.style || "slate";
  $("styleGrid").innerHTML = STYLES.map(s => `<button class="theme-chip ${cur===s.id?"on":""}" type="button" data-style="${s.id}"><div class="theme-swatch"><i style="background:${s.a}"></i><i style="background:${s.b}"></i><i style="background:${s.c}"></i></div><div class="t">${s.name}</div></button>`).join("");
}

function eventForm(pre={}) {
  const d0 = pre.date || ymd(cursor);
  openSheet(`
    <h2>${pre.id?"Edit event":"Add event"}</h2>
    <label>Title<input id="eTitle" value="${pre.title||""}" /></label>
    <div class="row">
      <label>Date<input id="eDate" type="date" value="${d0}" /></label>
      <label>Colour<input id="eColor" type="color" value="${hex(pre.color||"#6aa7e8")}" /></label>
    </div>
    <div class="row">
      <label>Start<input id="eStart" type="time" value="${minToTime(pre.start??9*60)}" /></label>
      <label>End<input id="eEnd" type="time" value="${minToTime(pre.end??17*60)}" /></label>
    </div>
    <div class="actions">
      ${pre.id?`<button class="btn danger" id="eDel">Delete</button>`:""}
      <button class="btn ghost" id="eCancel">Cancel</button>
      <button class="btn primary" id="eSave">Save</button>
    </div>`);
  $("eCancel").onclick = closeSheet;
  $("eSave").onclick = () => {
    const base = {
      title: $("eTitle").value.trim() || "Event",
      color: hex($("eColor").value),
      start: timeToMin($("eStart").value),
      end: timeToMin($("eEnd").value)
    };
    if (base.end <= base.start) base.end = Math.min(1440, base.start + 60);
    const ev = { id: pre.id || uid(), date: $("eDate").value, ...base };
    if (pre.id) state.fixed = state.fixed.map(f => f.id===pre.id?ev:f);
    else state.fixed.push(ev);
    closeSheet(); render();
  };
  if (pre.id) {
    $("eDel").onclick = () => {
      state.fixed = state.fixed.filter(f => f.id !== pre.id);
      closeSheet(); render();
    };
  }
}

// Listeners
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.range) range = b.dataset.range;
  showTab(b.dataset.tab || "cal");
}));
$("tabAdd").onclick = () => eventForm({ date: ymd(cursor) });
$("settingsBtn").onclick = () => showTab("settings");
document.addEventListener("click", e => {
  if (e.target.closest("[data-back]")) showTab("cal");
  const chip = e.target.closest("[data-style]");
  if (chip) {
    state.settings.style = chip.dataset.style;
    applyStyle();
    saveLocal();
    renderSettings();
  }
});
$("prev").onclick = () => {
  if (range==="day"||range==="today") cursor=addDays(cursor,-1);
  else if (range==="week") cursor=addDays(cursor,-7);
  else cursor=new Date(cursor.getFullYear(), cursor.getMonth()-1, 1);
  render();
};
$("next").onclick = () => {
  if (range==="day"||range==="today") cursor=addDays(cursor,1);
  else if (range==="week") cursor=addDays(cursor,7);
  else cursor=new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  render();
};
$("todayBtn").onclick = () => { cursor = new Date(); render(); };
$("saveLocal").onclick = () => {
  state.settings.sleepStart = timeToMin($("sleepStart").value);
  state.settings.sleepEnd = timeToMin($("sleepEnd").value);
  state.settings.defaultTravel = Number($("defTravel").value)||0;
  saveLocal();
  alert("Settings saved");
};
$("calBody").addEventListener("click", e => {
  const block = e.target.closest(".block");
  if (block && block.dataset.kind === "fixed") {
    const f = state.fixed.find(x => x.id===block.dataset.id);
    if (f) eventForm(f);
    return;
  }
  const mday = e.target.closest("[data-date]");
  if (mday && mday.dataset.date) {
    cursor = parseYmd(mday.dataset.date);
    range = "day";
    render();
    return;
  }
  const slot = e.target.closest("[data-hour]");
  if (slot) eventForm({ date: slot.dataset.date, start: Number(slot.dataset.hour)*60, end: Number(slot.dataset.hour)*60+60 });
});

$("loginSignIn").onclick = doSignIn;
$("loginSignUp").onclick = doSignUp;
$("loginSkip").onclick = () => {
  skipLogin = true;
  localStorage.setItem("ss-skip-login", "1");
  showMainApp();
};

// Start
document.documentElement.setAttribute("data-theme", localStorage.getItem("ss-theme") || "dark");
applyStyle();
initFirebase();
</script>
</body>
</html>
